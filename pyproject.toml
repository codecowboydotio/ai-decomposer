[project]
name = "decentralized-decomposer"
version = "0.1.0"
description = "Peer-to-peer goal decomposition: decentralized generate -> score -> refine over libp2p"
requires-python = ">=3.11"
dependencies = [
    "libp2p>=0.7.0",
    "pydantic>=2.6",
    "anthropic>=0.40",
    "trio>=0.25",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-trio>=0.8",
    "pytest-mock>=3.14",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
trio_mode = true
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["decentralized_decomposer*"]
